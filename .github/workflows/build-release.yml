name: Build Mikael Launcher V3.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply Mikael overlay and hardening
        run: bash mikael_overlay/prepare_pojav.sh

      - name: Build Release APK
        working-directory: pojav-core
        run: |
          chmod +x gradlew
          ./gradlew assembleFullRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          find pojav-core/app_pojavlauncher/build/outputs/apk -type f -name '*.apk' -print
          APK="$(find pojav-core/app_pojavlauncher/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Mikael-Launcher-V3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mikael-Launcher-V3.1
          path: Mikael-Launcher-V3.1.apk
          if-no-files-found: error
