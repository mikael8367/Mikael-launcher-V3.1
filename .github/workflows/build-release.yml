name: Validate Mikael Launcher V3.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply Mikael overlay and hardening
        run: bash mikael_overlay/prepare_pojav.sh

      - name: Compile Java sources only (no APK)
        working-directory: pojav-core
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:compileFullDebugJavaWithJavac --no-daemon --stacktrace

      - name: Run Android lint (no APK)
        working-directory: pojav-core
        run: |
          ./gradlew :app_pojavlauncher:lintFullDebug --no-daemon --stacktrace
