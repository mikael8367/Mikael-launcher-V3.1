name: Build Mikael Launcher V3.1 APK

on:
  push:
    paths:
      - 'mikael_overlay/**'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply Mikael overlay and hardening
        run: bash mikael_overlay/prepare_pojav.sh

      - name: Static Mikael regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("pojav-core/app_pojavlauncher/src/main")
          home = Path("mikael_overlay/src/main/java/net/kdt/pojavlaunch/MikaelHomeActivity.java").read_text()
          script = Path("mikael_overlay/prepare_pojav.sh").read_text()
          assert "ensureDefaultControlLayout" in home
          assert "mikael_managed_game" in script
          assert "mikael_show_fps" in script
          assert "LauncherActivity" in script
          print("Mikael regression checks: PASS")
          PY
      - name: Compile Java sources
        working-directory: pojav-core
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:compileFullDebugJavaWithJavac --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: pojav-core
        run: |
          ./gradlew :app_pojavlauncher:lintFullDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: pojav-core
        run: |
          ./gradlew :app_pojavlauncher:assembleFullDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mikael-Launcher-V3.1-debug
          path: pojav-core/app_pojavlauncher/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find pojav-core/app_pojavlauncher/build/outputs/apk/full/debug -name '*.apk' -print -quit)
          TAG="v3.1-build-${{ github.run_number }}"
          gh release create "$TAG" "$APK"             --title "Mikael Launcher V3.1 • Build ${{ github.run_number }}"             --notes "APK debug gerado após auditoria de controles, versões e modloaders."             --prerelease
