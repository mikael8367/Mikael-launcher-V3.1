name: Build Mikael Launcher V3.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mikael_overlay/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply Mikael overlay and hardening
        run: bash mikael_overlay/prepare_pojav.sh

      - name: Static OptiFine regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("pojav-core/app_pojavlauncher/src/main")
          task = (root / "java/net/kdt/pojavlaunch/modloaders/OptiFineDownloadTask.java").read_text()
          of_utils = (root / "java/net/kdt/pojavlaunch/modloaders/OptiFineUtils.java").read_text()
          of_frag = (root / "java/net/kdt/pojavlaunch/fragments/OptiFineInstallFragment.java").read_text()
          installer = (root / "java/net/kdt/pojavlaunch/instances/InstanceInstaller.java").read_text()
          watcher = (root / "java/net/kdt/pojavlaunch/instances/profcompat/ProfileWatcher.java").read_text()
          assert "downloadGame" in task
          assert "prepareForInstall" in task
          assert "O link de download do OptiFine não está disponível." in of_utils
          assert "Não foi possível encontrar o link final do instalador do OptiFine." in (root / "java/net/kdt/pojavlaunch/modloaders/OFDownloadPageScraper.java").read_text()
          assert "Instances.setSelectedInstance(installedInstance);" in of_frag
          assert "MikaelHomeActivity.class" in installer
          assert "LauncherActivity.class" not in installer
          assert "store == null || store.profiles == null" in watcher
          print("OptiFine regression checks: PASS")
          PY

      - name: Compile Java sources
        working-directory: pojav-core
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:compileFullDebugJavaWithJavac --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: pojav-core
        run: |
          ./gradlew :app_pojavlauncher:lintFullDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: pojav-core
        run: |
          ./gradlew :app_pojavlauncher:assembleFullDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mikael-Launcher-V3.1-debug
          path: pojav-core/app_pojavlauncher/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find pojav-core/app_pojavlauncher/build/outputs/apk/full/debug -name '*.apk' -print -quit)
          TAG="v3.1-build-${{ github.run_number }}"
          gh release create "$TAG" "$APK"             --title "Mikael Launcher V3.1 • Build ${{ github.run_number }}"             --notes "APK debug gerado após auditoria de controles, versões e modloaders."             --prerelease
